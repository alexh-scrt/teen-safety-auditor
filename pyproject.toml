# pyproject.toml — Project metadata and dependency configuration for teen_safety_auditor

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "teen_safety_auditor"
version = "0.1.0"
description = "A developer-focused web tool to audit AI prompts and conversations against OpenAI teen safety policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Teen Safety Auditor Contributors" }
]
keywords = ["ai", "safety", "moderation", "openai", "teen", "policy", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "openai>=1.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
teen-safety-auditor = "teen_safety_auditor.main:run"

[project.urls]
Homepage = "https://github.com/example/teen_safety_auditor"
Issues = "https://github.com/example/teen_safety_auditor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["teen_safety_auditor*"]

[tool.setuptools.package-data]
teen_safety_auditor = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py311"
